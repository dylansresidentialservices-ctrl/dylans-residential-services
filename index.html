*{box-sizing:border-box}

:root{
  --blue:#1373e6;
  --blue2:#0d5fc5;
  --green:#16a34a;
  --red:#dc2626;
  --orange:#ea580c;
  --purple:#7c3aed;
  --bg:#0f1115;
  --panel:#181b21;
  --panel2:#20242c;
  --border:#343944;
  --text:#f4f6f8;
  --muted:#aab1bd;
  --input:#11141a;
  --shadow:0 8px 30px rgba(0,0,0,.25);
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:#15181e;
  border-bottom:1px solid var(--border);
  padding:14px 18px;
  box-shadow:var(--shadow);
}

.header-inner{
  max-width:1250px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand h1{
  margin:0;
  font-size:22px;
}

.brand p{
  margin:4px 0 0;
  color:var(--muted);
  font-size:12px;
}

.menu-btn{
  display:none;
  background:var(--panel2);
  color:white;
  border:1px solid var(--border);
  border-radius:8px;
  padding:9px 12px;
  font-size:20px;
}

nav{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.nav-btn{
  border:1px solid var(--border);
  background:var(--panel2);
  color:#dce2ea;
  padding:10px 13px;
  border-radius:8px;
}

.nav-btn:hover,
.nav-btn.active{
  background:var(--blue);
  border-color:var(--blue);
  color:white;
}

main{
  max-width:1250px;
  margin:auto;
  padding:25px 18px 60px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.page-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px;
}

  font-size:25px;
