<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dylan's Residential Services</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: sans-serif; background: #0d1215; color: white; padding: 20px; }
        .card { background: #1a2226; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .btn-primary { background: #0077cc; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; }
        input, select { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: none; }
    </style>
</head>
<body>

    <h1>Dylan's Residential Services</h1>

    <!-- 1. SERVICES MANAGER SECTION -->
    <div class="card">
        <h3>Manage Services & Prices</h3>
        <input type="text" id="service-name" placeholder="Service Name (e.g. Regular Clean)">
        <input type="number" id="service-price" placeholder="Price ($)">
        <button onclick="addService()" class="btn-primary">Add Service</button>
        <ul id="services-list"></ul>
    </div>

    <!-- 2. NEW JOB FORM -->
    <div class="card">
        <h3>Create New Job</h3>
        <select id="job-service-select" onchange="document.getElementById('job-price').value = this.value">
            <option value="">Select a service to auto-fill price...</option>
        </select>
        <input type="number" id="job-price" placeholder="Price ($)">
        <button onclick="saveJob()" class="btn-primary">Save Job</button>
    </div>

    <script>
        let services = JSON.parse(localStorage.getItem('myServices')) || [];
        
        function addService() {
            const name = document.getElementById('service-name').value;
            const price = document.getElementById('service-price').value;
            if (name && price) {
                services.push({ name, price });
                localStorage.setItem('myServices', JSON.stringify(services));
                renderServices();
                alert('Service added!');
            }
        }

        function renderServices() {
            const list = document.getElementById('services-list');
            const select = document.getElementById('job-service-select');
            list.innerHTML = '';
            select.innerHTML = '<option value="">Select a service...</option>';
            services.forEach((s, i) => {
                list.innerHTML += `<li>${s.name}: $${s.price}</li>`;
                select.innerHTML += `<option value="${s.price}">${s.name} ($${s.price})</option>`;
            });
        }

        // Initialize on load
        renderServices();
        if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js"); }
    </script>
</body>
</html>
