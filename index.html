<thead>
  <tr>
    <th>Client</th>
    <th>Phone</th>
    <th>Email</th>
    <th>Address</th>
    <th>Actions</th>
  </tr>
</thead>
<script>
let clients = [];
let editIndex = -1;

function addClient() {
    const name = document.getElementById('clientName').value;
    const phone = document.getElementById('phone').value;
    const email = document.getElementById('email').value;
    const address = document.getElementById('address').value;
    const notes = document.getElementById('notes').value;

    if (!name) {
        alert("Client name required");
        return;
    }

    const client = { name, phone, email, address, notes };

    if (editIndex === -1) {
        clients.push(client);
    } else {
        clients[editIndex] = client;
        editIndex = -1;
        document.getElementById("addBtn").innerText = "Add client";
    }

    clearForm();
    renderClients();
}

function editClient(index) {
    const client = clients[index];

    document.getElementById('clientName').value = client.name;
    document.getElementById('phone').value = client.phone;
    document.getElementById('email').value = client.email;
    document.getElementById('address').value = client.address;
    document.getElementById('notes').value = client.notes;

    editIndex = index;
    document.getElementById("addBtn").innerText = "Update client";
}

function deleteClient(index) {
    clients.splice(index, 1);
    renderClients();
}

function renderClients() {
    const table = document.getElementById("clientTable");
    table.innerHTML = "";

    clients.forEach((client, i) => {
        table.innerHTML += `
            <tr>
                <td>${client.name}</td>
                <td>${client.phone}</td>
                <td>${client.email}</td>
                <td>${client.address}</td>
                <td>
                    <button onclick="editClient(${i})">Edit</button>
                    <button onclick="deleteClient(${i})">Delete</button>
                </td>
            </tr>
        `;
    });
}

function clearForm() {
    document.getElementById('clientName').value = "";
    document.getElementById('phone').value = "";
    document.getElementById('email').value = "";
    document.getElementById('address').value = "";
    document.getElementById('notes').value = "";
}
</script>
<button id="addBtn" onclick="addClient()">Add client</button>
<tbody id="clientTable"></tbody>
<input id="clientName" placeholder="Client name">
<input id="phone" placeholder="Phone">
<input id="email" placeholder="Email">
<input id="address" placeholder="Address">
<textarea id="notes"></textarea>
