<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dylan's Residential Services</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: sans-serif; background: #0d1215; color: white; padding: 20px; }
        .card { background: #1a2226; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .btn-primary { background: #0077cc; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; width: 100%; }
        .btn-secondary { background: #334148; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; margin-bottom: 10px; }
        .btn-danger { background: #cc0000; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; margin-left: 10px; }
        input, select { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: none; box-sizing: border-box; }
        li { margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        ul { padding-left: 0; list-style: none; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h1>Dylan's Residential Services</h1>

    <!-- 1. SERVICES MANAGER SECTION -->
    <div class="card">
        <h3>Services & Prices</h3>
        
        <!-- Toggle Button to Open Form -->
        <button onclick="toggleServiceForm()" class="btn-secondary" id="toggle-form-btn">+ Add New Service</button>

        <!-- Hidden Form Container (Appears when button is clicked) -->
        <div id="service-form-container" class="hidden" style="margin-bottom: 15px; border-top: 1px solid #334148; padding-top: 10px;">
            <input type="text" id="service-name" placeholder="Service Name (e.g. Regular Clean)">
            <input type="number" id="service-price" placeholder="Price ($)">
            <button onclick="addService()" class="btn-primary">Save Service</button>
        </div>

        <ul id="services-list"></ul>
    </div>

    <!-- 2. NEW JOB FORM -->
    <div class="card">
        <h3>Create New Job</h3>
        <select id="job-service-select" onchange="document.getElementById('job-price').value = this.value">
            <option value="">Select a service to auto-fill price...</option>
        </select>
        <input type="number" id="job-price" placeholder="Price ($)">
        <button onclick="saveJob()" class="btn-primary">Save Job</button>
    </div>

    <script>
        let services = JSON.parse(localStorage.getItem('myServices')) || [];
        
        function toggleServiceForm() {
            const formContainer = document.getElementById('service-form-container');
            const btn = document.getElementById('toggle-form-btn');
            if (formContainer.classList.contains('hidden')) {
                formContainer.classList.remove('hidden');
                btn.innerText = 'Cancel';
            } else {
                formContainer.classList.add('hidden');
                btn.innerText = '+ Add New Service';
            }
        }

        function addService() {
            const name = document.getElementById('service-name').value;
            const price = document.getElementById('service-price').value;
            if (name && price) {
                services.push({ name, price });
                localStorage.setItem('myServices', JSON.stringify(services));
                renderServices();
                
                // Clear and hide form
                document.getElementById('service-name').value = '';
                document.getElementById('service-price').value = '';
                toggleServiceForm();
            } else {
                alert('Please enter both a service name and a price.');
            }
        }

        function deleteService(index) {
            services.splice(index, 1);
            localStorage.setItem('myServices', JSON.stringify(services));
            renderServices();
        }

        function renderServices() {
            const list = document.getElementById('services-list');
            const select = document.getElementById('job-service-select');
            list.innerHTML = '';
            select.innerHTML = '<option value="">Select a service...</option>';
            
            services.forEach((s, i) => {
                list.innerHTML += `<li><span>${s.name}: $${s.price}</span> <button onclick="deleteService(${i})" class="btn-danger">Delete</button></li>`;
                select.innerHTML += `<option value="${s.price}">${s.name} ($${s.price})</option>`;
            });
        }

        function saveJob() {
            const price = document.getElementById('job-price').value;
            if(price) {
                alert('Job saved with price: $' + price);
            } else {
                alert('Please select or enter a price for the job.');
            }
        }

        // Initialize on load
        renderServices();
        if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js"); }
    </script>
</body>
</html>
